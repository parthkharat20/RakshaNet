services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: rakshanet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: raksha
      POSTGRES_PASSWORD: rakshanet_secret
      POSTGRES_DB: rakshanet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raksha -d rakshanet"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: rakshanet-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/rakshanet_secret
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rakshanet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rakshanet-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: raksha
      POSTGRES_PASSWORD: rakshanet_secret
      POSTGRES_DB: rakshanet
      DATABASE_URL: postgresql+asyncpg://raksha:rakshanet_secret@postgres:5432/rakshanet
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: rakshanet_secret
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: rakshanet_super_secure_jwt_secret_key_2026
      CORS_ORIGINS: "http://localhost,http://localhost:5173,http://localhost:80,http://127.0.0.1:5173,http://127.0.0.1:80"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rakshanet-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  neo4j_data:
  redis_data:
